{% extends "base.html" %}
{% block title %}Sign in · Secure File Manager{% endblock %}
{% block content %}
  <section class="auth-panel" aria-labelledby="form-title">
    <p class="eyebrow">Welcome back</p>
    <h1 id="form-title" class="form-title">Sign in.</h1>
    {% if error %}<p class="message message-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}" class="account-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" maxlength="30" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button class="button" type="submit">Sign in</button>
    </form>
    <p class="form-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
  </section>
{% endblock %}
